experiment:
  name: paper_phi_seed0
  output: runs/paper_phi_seed0
dataset:
  manifests: artifacts/reditbench-v1
  cache: artifacts/reditbench-tokens-v1
  max_text_length: 128
model:
  showo_path: hf_model/show-o
  tokenizer_path: hf_model/phi-1_5
  vq_path: hf_model/magvitv2
  dimension: 256
  heads: 8
  hrm_layers: 4
  visual_adapter_width: 320
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
training:
  seed: 0
  epochs: 100
  batch_size: 8
  gradient_accumulation_steps: 1
  # 2 GPUs * 8 samples = effective batch 16 and 16 simultaneous HA pairs.
  expected_world_size: 2
  precision: bf16
  gradient_checkpointing: true
  lr: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.03
  gradient_clip: 1.0
  num_workers: 2
  validate_every: 1
  save_every: 5
  validation_seed: 12345
