experiment:
  name: qwen35_bridge_seed0_20261126
  output: runs/qwen35_bridge_seed0_20261126
dataset:
  manifests: artifacts/reditbench-v1
  cache: artifacts/reditbench-tokens-v1
  features: artifacts/qwen35-grounding-features-v2
  regions: artifacts/weak-regions-v1
  max_text_length: 128
model:
  showo_path: hf_model/show-o
  tokenizer_path: hf_model/phi-1_5
  vq_path: hf_model/magvitv2
  feature_hidden: 2560
  dimension: 256
  heads: 8
  hrm_layers: 4
  adapter_width: 256
  region_weight: 1.0
  edited_token_weight: 4.0
  native_prior_strength: 1.0
training:
  seed: 0
  epochs: 100
  batch_size: 8
  gradient_accumulation_steps: 1
  expected_world_size: 2
  lr: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.03
  gradient_clip: 1.0
  gradient_checkpointing: true
  num_workers: 2
  validation_seed: 12345
  save_every: 5
selection:
  region_threshold: 0.35
  min_region_ratio: 0.01
  max_region_ratio: 0.6
  metric: edited_validation_CE_plus_2x_one_minus_weak_region_IoU
  iou_weight: 2.0
  weak_label_occupancy_threshold: 0.2
  not_a_table1_metric: true
